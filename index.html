<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>像外之境 - 蓝田水陆庵彩塑艺术影像作品展</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html, body {
        width: 100%;
        height: 100%;
        font-family: "PingFang SC", "Microsoft YaHei", serif;
        color: #fff;
        overflow: hidden;
    }

    body {
        background: url('bg.png') no-repeat center center fixed;
        background-size: cover;
    }

    /* 视频居中显示，不遮挡背景主体 */
    .video-wrap {
        position: absolute;
        left: 50%;
        top: 45%;
        transform: translate(-50%, -50%);
        width: min(70%, 600px);
        aspect-ratio: 16 / 9;
        z-index: 10;
    }

    video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        background: #222;
        border-radius: 8px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    }

    .play-btn {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 70px;
        height: 70px;
        background: #fff;
        border-radius: 50%;
        cursor: pointer;
        z-index: 11;
        transition: 0.2s;
    }
    .play-btn:hover {
        transform: translate(-50%, -50%) scale(1.12);
    }
    .play-btn::after {
        content: '';
        position: absolute;
        left: 55%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 0;
        height: 0;
        border-left: 22px solid #d4af37;
        border-top: 13px solid transparent;
        border-bottom: 13px solid transparent;
    }

    .video-wrap.playing .play-btn {
        opacity: 0;
        pointer-events: none;
    }

    /* 手机端适配 */
    @media (max-width:768px) {
        .video-wrap {
            top: 45%;
            width: 85%;
        }
        .play-btn {
            width: 55px;
            height: 55px;
        }
    }
</style>
</head>
<body>

<div class="video-wrap" id="videoWrap">
    <video id="video" loop playsinline controls autoplay>
        <source src="video.mp4" type="video/mp4">
    </video>
    <div class="play-btn" id="playBtn"></div>
</div>

<script>
    const video = document.getElementById('video');
    const videoWrap = document.getElementById('videoWrap');
    const playBtn = document.getElementById('playBtn');

    playBtn.addEventListener('click', () => {
        if (video.paused) {
            video.play();
        } else {
            video.pause();
        }
    });

    video.addEventListener('play', () => {
        videoWrap.classList.add('playing');
    });
    video.addEventListener('pause', () => {
        videoWrap.classList.remove('playing');
    });
</script>

</body>
</html>
