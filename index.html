<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>像外之境 - 蓝田水陆庵彩塑艺术影像作品展</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html {
        width: 100%;
        height: 100%;
        font-family: "PingFang SC", "Microsoft YaHei", serif;
        color: #fff;
    }

    body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        font-family: "PingFang SC", "Microsoft YaHei", serif;
        color: #fff;
        background: #16120a;
    }

    /* 模糊填充层：铺满全屏，消除手机端上下空白 */
    .bg-fill {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        background: url('bg.png') center center / cover no-repeat;
        filter: blur(24px) brightness(0.9);
        transform: scale(1.15);
        pointer-events: none;
    }

    /* 背景主体层：完整显示背景图片 */
    .bg-layer {
        position: relative;
        width: 100%;
        height: 100%;
        z-index: 1;
        overflow: hidden;
        background: transparent;
    }

    .bg-layer img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        display: block;
    }

    /* 视频居中显示，不遮挡背景主体 */
    .video-wrap {
        position: absolute;
        left: 50%;
        top: 45%;
        transform: translate(-50%, -50%);
        width: min(70%, 600px);
        aspect-ratio: 16 / 9;
        z-index: 10;
    }

    video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        background: #222;
        border-radius: 8px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    }

    .play-btn {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 70px;
        height: 70px;
        background: #fff;
        border-radius: 50%;
        cursor: pointer;
        z-index: 11;
        transition: 0.2s;
    }
    .play-btn:hover {
        transform: translate(-50%, -50%) scale(1.12);
    }
    .play-btn::after {
        content: '';
        position: absolute;
        left: 55%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 0;
        height: 0;
        border-left: 22px solid #d4af37;
        border-top: 13px solid transparent;
        border-bottom: 13px solid transparent;
    }

    .video-wrap.playing .play-btn {
        opacity: 0;
        pointer-events: none;
    }

    /* 手机端适配：模糊填充铺满全屏消除空白，完整图左右可见，视频居中靠右避让 */
    @media (max-width:768px) {
        .bg-fill {
            display: block;
            background: url('bg-mobile.jpg') center center / cover no-repeat;
        }
        .bg-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        .bg-layer img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center;
            display: block;
        }
        .video-wrap {
            left: 62%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 46%;
        }
        .play-btn {
            width: 50px;
            height: 50px;
        }
        .play-btn::after {
            border-left: 16px solid #d4af37;
            border-top: 10px solid transparent;
            border-bottom: 10px solid transparent;
        }
    }
</style>
</head>
<body>

<div class="bg-fill" aria-hidden="true"></div>

<div class="bg-layer" aria-hidden="true">
    <picture>
        <source media="(max-width:768px)" srcset="bg-mobile.jpg">
        <img src="bg.png" alt="">
    </picture>
    <div class="video-wrap" id="videoWrap">
        <video id="video" loop playsinline controls autoplay>
            <source src="video.mp4" type="video/mp4">
        </video>
        <div class="play-btn" id="playBtn"></div>
    </div>
</div>

<script>
    const video = document.getElementById('video');
    const videoWrap = document.getElementById('videoWrap');
    const playBtn = document.getElementById('playBtn');

    playBtn.addEventListener('click', () => {
        if (video.paused) {
            video.play();
        } else {
            video.pause();
        }
    });

    video.addEventListener('play', () => {
        videoWrap.classList.add('playing');
    });
    video.addEventListener('pause', () => {
        videoWrap.classList.remove('playing');
    });
</script>

</body>
</html>
