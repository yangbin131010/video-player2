<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>像外之境 - 蓝田水陆庵彩塑艺术影像作品展</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html, body {
        width: 100%;
        height: 100%;
        font-family: "PingFang SC", "Microsoft YaHei", serif;
        color: #fff;
        overflow: hidden;
        background: #c4c4c4;
    }

    .header {
        position: absolute;
        top: 60px;
        left: 60px;
        display: flex;
        gap: 40px;
        opacity: 0.9;
    }
    .org {
        font-size: 18px;
        line-height: 1.4;
    }
    .org-en {
        font-size: 14px;
        opacity: 0.7;
    }

    .title-box {
        position: absolute;
        bottom: 60px;
        left: 60px;
    }
    .title-main {
        font-size: 96px;
        font-weight: 600;
        color: #d4af37;
        line-height: 1;
        margin-bottom: 16px;
    }
    .title-sub {
        font-size: 28px;
        margin-bottom: 16px;
    }
    .title-en {
        font-size: 42px;
        font-weight: 300;
        opacity: 0.9;
    }
    .title-en-sub {
        font-size: 18px;
        opacity: 0.7;
    }

    /* 核心：标题正上方居中，不挡顶部文字 */
    .video-wrap {
        position: absolute;
        left: 50%;
        top: 32%;
        transform: translate(-50%, -50%);
        width: min(70%, 600px);
        aspect-ratio: 16 / 9;
        z-index: 10;
    }

    video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        background: #222;
        border-radius: 8px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    }

    .play-btn {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 70px;
        height: 70px;
        background: #fff;
        border-radius: 50%;
        cursor: pointer;
        z-index: 11;
        transition: 0.2s;
    }
    .play-btn:hover {
        transform: translate(-50%, -50%) scale(1.12);
    }
    .play-btn::after {
        content: '';
        position: absolute;
        left: 55%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 0;
        height: 0;
        border-left: 22px solid #d4af37;
        border-top: 13px solid transparent;
        border-bottom: 13px solid transparent;
    }

    .video-wrap.playing .play-btn {
        opacity: 0;
        pointer-events: none;
    }

    /* 手机端完美居中，不靠边、不靠右 */
    @media (max-width:768px) {
        .header {
            top: 30px;
            left: 20px;
            flex-direction: column;
            gap: 16px;
        }
        .title-box {
            bottom: 30px;
            left: 20px;
        }
        .title-main {
            font-size: 48px;
        }
        .title-sub {
            font-size: 18px;
        }
        .title-en {
            font-size: 24px;
        }
        .video-wrap {
            top: 30%;
            width: 80%;
        }
        .play-btn {
            width: 55px;
            height: 55px;
        }
    }
</style>
</head>
<body>

<div class="header">
    <div class="org">
        <div>国家艺术基金资助项目</div>
        <div class="org-en">National Art Fund Project</div>
    </div>
    <div class="org">
        <div>北京理工大学</div>
        <div class="org-en">Beijing Institute of Technology</div>
    </div>
</div>

<div class="title-box">
    <div class="title-main">像外之境</div>
    <div class="title-sub">蓝田水陆庵彩塑艺术影像作品展</div>
    <div class="title-en">Beyond Images</div>
    <div class="title-en-sub">Video & Image Exhibition of Lantian Shuilu'an Painted Sculptures</div>
</div>

<div class="video-wrap" id="videoWrap">
    <video id="video" loop playsinline controls autoplay>
        <source src="video.mp4" type="video/mp4">
    </video>
    <div class="play-btn" id="playBtn"></div>
</div>

<script>
    const video = document.getElementById('video');
    const videoWrap = document.getElementById('videoWrap');
    const playBtn = document.getElementById('playBtn');

    playBtn.addEventListener('click', () => {
        if (video.paused) {
            video.play();
        } else {
            video.pause();
        }
    });

    video.addEventListener('play', () => {
        videoWrap.classList.add('playing');
    });
    video.addEventListener('pause', () => {
        videoWrap.classList.remove('playing');
    });
</script>

</body>
</html>
